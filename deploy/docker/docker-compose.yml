# Fundora — Docker Compose (Production)
# Orchestrates Fundora application, database, Redis, and monitoring stack

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  fundora-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # ============================================================
  # Application
  # ============================================================
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: fundora/app:latest
    container_name: fundora-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BUILD_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - REDIS_URL=redis://redis:6379
      - ENABLE_TRACING=${ENABLE_TRACING:-false}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CACHE_BACKEND=${CACHE_BACKEND:-memory}
      - JOB_CONCURRENCY=${JOB_CONCURRENCY:-5}
      - HEALTH_CHECK_URL=http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fundora-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ============================================================
  # Redis (Cache, Rate Limiting, Job Queue)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: fundora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fundora-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    command: redis-server --appendonly yes --appendfsync everysec

  # ============================================================
  # Prometheus (Metrics Collection)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: fundora-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - fundora-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # ============================================================
  # Grafana (Visualization & Dashboards)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: fundora-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fundora-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "256M"
