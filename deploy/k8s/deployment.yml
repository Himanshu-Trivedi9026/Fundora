# Fundora — Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundora-app
  namespace: fundora
  labels:
    app: fundora
    component: app
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fundora
      component: app
  template:
    metadata:
      labels:
        app: fundora
        component: app
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: fundora-app
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: fundora/app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fundora-secrets
                  key: supabase-url
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: fundora-secrets
                  key: supabase-service-role-key
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: fundora-secrets
                  key: nextauth-secret
            - name: NEXTAUTH_URL
              value: "https://fundora.app"
            - name: REDIS_URL
              value: "redis://fundora-redis:6379"
            - name: LOG_LEVEL
              value: "info"
            - name: CACHE_BACKEND
              value: "memory"
            - name: ENABLE_TRACING
              value: "false"
            - name: ENABLE_METRICS
              value: "true"
            - name: JOB_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Fundora — Service
apiVersion: v1
kind: Service
metadata:
  name: fundora-app
  namespace: fundora
  labels:
    app: fundora
    component: app
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: fundora
    component: app
---
# Fundora — HPA (Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fundora-app
  namespace: fundora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fundora-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
