apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fundora.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fundora.labels" . | nindent 4 }}
type: Opaque
stringData:
  supabase-url: {{ .Values.secrets.supabaseUrl | quote }}
  supabase-service-role-key: {{ .Values.secrets.supabaseServiceRoleKey | quote }}
  nextauth-secret: {{ .Values.secrets.nextauthSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
